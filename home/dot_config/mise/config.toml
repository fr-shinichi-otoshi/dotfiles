[settings]
idiomatic_version_file_enable_tools = ["node", "terraform"]

[tools]
# 既存
gh = "2.103.3"
sops = "3.13.3"
age = "1.3.2"

# シェル基盤
fzf = "0.74.5"
ripgrep = "15.2.0"
fd = "10.5.0"
eza = "0.23.5"
sheldon = "0.8.5"
starship = "1.27.0"
atuin = "18.24.4"

# Git
lazygit = "0.66.2"
lefthook = "2.2.2"
delta = "0.20.1"

# ランタイム / IaC
node = "24"
uv = "0.13.6"
terraform = "1"
tflint = "0.65.0"
terraform-docs = "0.24.0"

# 追加 CLI
broot = "1.61.0"
gping = "1.21.0"
ripgrep-all = "0.10.10"
lazydocker = "0.25.2"

# エージェント / レビュー
herdr = "0.9.5"
hunk = "0.24.1"

# 構造化データ / 構文検索
jq = "1.8.2"
yq = "4.54.3"
ast-grep = "0.51.3"

# 検査 / 計測
shellcheck = "0.11.0"
shfmt = "3.14.1"
ruff = "0.17.5"
"npm:knip" = "6.45.1"
osv-scanner = "2.7.1"
hyperfine = "2.0.0"

# 追加 CLI（プレビルド。短い名前は cargo / go のソースビルドに落ちることがある）
"aqua:gitui-org/gitui" = "0.28.1"
"aqua:Wilfred/difftastic" = "0.72.0"
"aqua:ducaale/xh" = "0.26.3"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:watchexec/watchexec" = "2.8.0"
"aqua:oxipng/oxipng" = "10.2.1"

# tokei はプレビルドが無い。rust を先に入れ、cargo でビルドする。
rust = "stable"

# GitHub Release に単体バイナリが無い npm パッケージ。実行は上の node。
"npm:@commitlint/cli" = "21.2.4"
"npm:repomix" = "1.19.0"

[tools."cargo:tokei"]
version = "15.0.0"
depends = ["rust"]

# cwebp。aqua / GitHub Release に無いため公式プレビルドを使う。
# https://developers.google.com/speed/webp/docs/precompiled
[tools."http:libwebp"]
version = "1.6.0"
strip_components = 1
bin_path = "bin"
version_list_url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/index.html"
version_regex = 'libwebp-(\d+\.\d+\.\d+)-linux-x86-64\.tar\.gz'

[tools."http:libwebp".platforms]
linux-x64 = { url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{ version }}-linux-x86-64.tar.gz" }
linux-arm64 = { url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{ version }}-linux-aarch64.tar.gz" }
macos-x64 = { url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{ version }}-mac-x86-64.tar.gz" }
macos-arm64 = { url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{{ version }}-mac-arm64.tar.gz" }
